[package]
name = "suki_no_konseki"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "app/svc-auth",
    "app/svc-crm",
    "lib/common-config",
    "lib/common-db",
    "lib/common-grpc",
    "lib/common-misc",
    "lib/common-type",
    "lib/common-web",
    "lib/internal-clients",
    "migration/migration-crm",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
common-config = { path = "lib/common-config" }
common-db = { path = "lib/common-db" }
common-web = { path = "lib/common-web" }
common-type = { path = "lib/common-type" }
common-grpc = { path = "lib/common-grpc" }

migration-crm = { path = "migration/migration-crm" }
migration-auth = { path = "migration/migration-auth" }

internal-clients = { path = "lib/internal-clients" }

actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
log = "0.4"
env_logger = "0.11"

sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "macros",
] }


utoipa = { version = "5", features = ["uuid", "chrono"] }
utoipa-actix-web = "0.1"
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
anyhow = "1"
thiserror = "1"

dotenvy = "0.15.7"
sea-orm-migration = "1.1.16"
argon2 = "0.5.3"
once_cell = "1.21.3"
jsonwebtoken = { version = "10.0.0", features = ["aws_lc_rs"] }
tonic = "0.14.2"
prost = "0.14.1"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"

base64 = "0.22.1"
blake3 = "1.8.2"
rand = "0.9.2"

[dependencies]
